[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-reverse-prompt"
version = "0.3.0"
description = "Reverse-engineer images into structured visual schemas and model-specific prompts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "typer>=0.12.0",
  "openai>=1.40.0",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "jsonschema>=4.23.0"
]

[project.scripts]
irp = "image_reverse_prompt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_reverse_prompt = [
  "resources/prompts/*.md",
  "resources/adapters/*.md",
  "resources/schemas/*.json"
]
