name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r requirements-dev.txt

      - name: Validate JSON Schemas and examples
        run: python scripts/validate_repo.py

      - name: Check packaged resource copies
        run: python scripts/check_packaged_resources.py

      - name: Build ChatGPT Skill bundle
        run: |
          python scripts/build_skill.py
          git diff --exit-code -- chatgpt-skill
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path("dist/image-reverse-prompt-chatgpt-skill.zip")
          assert archive_path.is_file()

          with ZipFile(archive_path) as archive:
              names = set(archive.namelist())

          required = {
              "SKILL.md",
              "prompts/analyze-image.md",
              "prompts/verify-image.md",
              "prompts/refine-schema.md",
              "adapters/gpt-image.md",
              "adapters/flux.md",
              "adapters/midjourney.md",
              "adapters/sdxl.md",
              "schemas/visual-schema.json",
              "schemas/poster-schema.json",
              "schemas/product-schema.json",
              "schemas/ui-schema.json",
          }
          assert required <= names
          assert not any(name.startswith("src/") for name in names)
          assert "pyproject.toml" not in names
          assert "requirements.txt" not in names
          assert not any(name.startswith("scripts/") for name in names)
          print("ChatGPT Skill bundle contents look correct.")
          PY

      - name: Check Python syntax
        run: python -m compileall -q scripts src

      - name: Smoke test CLI
        run: |
          irp --help
          irp validate examples/portrait.json

      - name: Smoke test installed package outside repository
        working-directory: /tmp
        run: |
          irp --help
          python - <<'PY'
          from image_reverse_prompt.paths import adapter_text, prompt_text, schema_text_for_type
          from image_reverse_prompt.schema_tools import load_schema_for_type

          assert "Analyze Image" in prompt_text("analyze-image.md")
          assert "FLUX Adapter" in adapter_text("flux.md")
          assert "Image Reverse Prompt Visual Schema" in schema_text_for_type("general")
          assert load_schema_for_type("poster")["title"] == "Poster Reverse Prompt Schema"
          print("Installed package resources are available outside the repository.")
          PY
